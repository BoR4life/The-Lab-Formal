<style>
  :root {

function scrubBrand(parsed) {
  const from = "Bundle of Rays Academy";
  const to = "The Lab";
  (parsed.cases || []).forEach((c) => {
    if (typeof c.provenance === "string") c.provenance = c.provenance.split(from).join(to);
    if (typeof c.ecgImage === "string" && c.ecgImage.indexOf("base64,") !== -1) {
      try {
        const i = c.ecgImage.indexOf("base64,") + 7;
        const xml = decodeURIComponent(escape(atob(c.ecgImage.slice(i))));
        if (xml.indexOf(from) !== -1) {
          c.ecgImage = c.ecgImage.slice(0, i) + btoa(unescape(encodeURIComponent(xml.split(from).join(to))));
        }
      } catch (err) { /* keep the stored image */ }
    }
  });
  return parsed;
}

function stepFields(step, data, prefix) {
  const f = (name) => prefix + name;
  const id = step.id;
  let inner = "";
  if (id === "rate") inner = choices(f("rate"), CHOICES.rate, data.rate);
  if (id === "rhythm") inner = choices(f("rhythm"), CHOICES.rhythm, data.rhythm);
  if (id === "p") inner = choices(f("pWaves"), CHOICES.pWaves, data.pWaves);
  if (id === "pr") inner = choices(f("pr"), CHOICES.pr, data.pr);
  if (id === "qrs") inner = choices(f("qrs"), CHOICES.qrs, data.qrs);
  if (id === "q") {
    inner = choices(f("qWave"), CHOICES.qWave, data.qWave);
    if (data.qWave === "pathological") inner += '<p class="subq">Which leads?</p>' + leadGrid(f("qLeads"), data.qLeads);
  }
  if (id === "st") {
    inner = choices(f("st"), CHOICES.st, data.st);
    if (data.st === "elevation" || data.st === "depression") {
      inner += '<p class="subq">Leads</p><p class="fine">Every lead that shows the ' + (data.st === "elevation" ? "elevation" : "depression") + " you selected. Reciprocal change is its own yes or no.</p>"
        + leadGrid(f("stLeads"), data.stLeads)
        + '<p class="subq">Reciprocal change?</p>' + choices(f("reciprocal"), YN, data.reciprocal);
    }
  }
  if (id === "t") inner = choices(f("tWaves"), CHOICES.tWaves, data.tWaves);
  if (id === "qtc") {
    const band = qtcBand(data.qtc);
    inner = '<label class="field"><span>QTc (ms)</span><input data-field="' + esc(f("qtc")) + '" data-focus="' + esc(f("qtc")) + '" inputmode="numeric" value="' + esc(data.qtc) + '"></label>'
      + '<p class="fine">' + (band ? "Band: " + esc(BAND_LABEL[band]) + ". " : "Enter the corrected QT, from 200 to 800. ")
      + "Normal is under 460 ms. Prolonged is 460–500. Over 500 ms is its own band.</p>";
  }
  if (id === "impression") {
    inner = '<label class="field"><span class="lbl">Your impression</span><textarea data-field="' + esc(f("impression")) + '" data-focus="' + esc(f("impression")) + '" placeholder="Rhythm in plain words, the differentials you are holding, the action you took, and who you escalated to.">' + esc(data.impression || "") + "</textarea></label>";
  }
  const needs = ui.highlight === (prefix ? "" : step.id) ? " needs" : "";
  return '<section class="step' + needs + '" id="step-' + step.id + '"><header class="step-h"><span class="num">' + step.n + "</span><h2>" + esc(step.title) + "</h2></header>" + inner + "</section>";
}

function markKind(score) {
  if (score >= 0.999) return "ok";
  if (score <= 0.001) return "bad";
  return "part";
}
function resultStep(step, answers, key, score) {
  const kind = markKind(score);
  const word = kind === "ok" ? "Correct" : kind === "bad" ? "Not correct" : "Partial · " + Math.round(score * 100) + "%";
  const icon = kind === "ok" ? iconTick() : kind === "bad" ? iconCross() : iconPartial();
  return '<section class="step result ' + kind + '"><header class="step-h"><span class="mark mark-' + kind + '">' + icon + '</span><span class="num">' + step.n + "</span><h2>" + esc(step.title) + '</h2><span class="pts">' + esc(word) + '</span></header><div class="compare"><div><h3>Your read</h3><p>' + esc(human(step.id, answers)) + '</p></div><div><h3>Key</h3><p>' + esc(human(step.id, key)) + "</p></div></div></section>";
}
function impressionBlock(mine, model) {
  return '<section class="step"><header class="step-h"><span class="num">10</span><h2>Impression</h2><span class="pts">Not auto-scored</span></header><div class="compare"><div><h3>Your impression</h3><p>' + esc(mine || "No submission") + '</p></div><div><h3>Model impression</h3><p>' + esc(model || "Not recorded") + "</p></div></div></section>";
}
function proveBlock(c) {
  const gap = !String(c.verifiedBy || "").trim() || !String(c.provenance || "").trim();
  return '<footer class="card"><p class="eyebrow">Provenance</p><p><strong>Verified by</strong> ' + esc(c.verifiedBy || "Not recorded") + "</p><p>" + esc(c.provenance || "No provenance note.") + "</p>"
    + (gap ? '<p class="warn">Verifier or provenance is missing. Treat this case with caution.</p>' : "") + "</footer>";
}
function caseMeta(c) {
  const bits = ["Month " + c.month, "Week " + c.week, slotLabel(c.slot)];
  if (c.retrieval) bits.push("Also retrieves month " + c.retrieval);
  return bits.join(" · ");
}
function pill(status) { return '<span class="pill ' + esc(status) + '">' + esc(statusLabel(status)) + "</span>"; }

function navBtn(view, label) {

function shell(wide, body) {
  const err = ui.error ? '<div class="wrap' + (wide ? " wide" : "") + '"><p class="warn" role="alert">' + esc(ui.error) + "</p></div>" : "";
  const storage = ui.storageError ? '<div class="wrap"><p class="warn" role="alert">' + esc(ui.storageError) + "</p></div>" : "";
  return header() + storage + err + '<main class="wrap' + (wide ? " wide" : "") + '">' + body + "</main>" + dialogHtml() + lightboxHtml();
}
function dialogHtml() {
  const d = ui.dialog;
  if (!d) return "";
  const titles = { submit: "Submit this read?", publish: "Publish with gaps?", delete: "Delete this case?", import: "Replace data on this device?", reset: "Restore the sample programme?" };
  const yes = { submit: "Submit", publish: "Publish anyway", delete: "Delete", import: "Replace data", reset: "Restore sample" }[d.kind];
  let body = "";
  if (d.kind === "submit") body = "<p>You cannot change it afterwards. Feedback appears when your facilitator releases it.</p>";
  if (d.kind === "publish") body = "<p>You can still publish. Learners will see whatever is missing.</p><ul>" + d.problems.map((p) => "<li>" + esc(p) + "</li>").join("") + "</ul>";
  if (d.kind === "delete") body = "<p>This removes the case and every submission attached to it from this device.</p>";
  if (d.kind === "import") body = "<p>Cases, learners, submissions, focus requests and contributed cases on this device will be replaced by the file. Export a copy first if you need this set.</p>";
  if (d.kind === "reset") body = "<p>This puts Week 1 back, with the trace you supplied. It removes cases you have added on this device.</p>";
  return '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="modal-card"><h2 id="dialog-title">' + titles[d.kind] + "</h2>" + body + '<div class="btn-row"><button type="button" class="btn" data-action="dialog-yes">' + yes + '</button><button type="button" class="btn secondary" data-action="dialog-no">Go back</button></div></div></div>';
}
function lightboxHtml() {
  if (!ui.lb) return "";
  return '<div class="lightbox" role="dialog" aria-modal="true" aria-label="ECG full screen"><div class="lb-bar"><p>Pinch, scroll or drag. Double-tap to zoom.</p><button type="button" data-action="zoom-out" aria-label="Zoom out">−</button><button type="button" data-action="zoom-in" aria-label="Zoom in">+</button><button type="button" data-action="zoom-fit">Fit</button><button type="button" data-action="close-lb">Close</button></div><div id="lb-stage"><img id="lb-img" alt="12-lead ECG, full screen" src="' + esc(ui.lb) + '"></div></div>';
}

function learnerMode(c) {
  if (route.preview) {
    if (c.status === "feedback") return "feedback";
    if (c.status === "open") return "form";
    if (c.status === "closed") return "closed";
    return "draft";
  }
  const sub = submissionFor(session.learnerId, c.id);
  if (c.status === "draft") return "hidden";
  if (c.status === "feedback") return sub ? "feedback" : "missed-feedback";
  if (sub) return "submitted";
  if (c.status === "open") return "form";
  if (c.status === "closed") return "missed-closed";
  return "hidden";
}
function myReleasedScores() {
  if (!session || session.role !== "learner") return [];
  const out = [];
  db.submissions.filter((s) => s.learnerId === session.learnerId).forEach((s) => {
    const c = caseById(s.caseId);
    if (c && c.status === "feedback") out.push({ c, s, score: scoreSubmission(c, s.answers) });
  });
  return out;
}

function learnerScoreLine() {
  const rows = myReleasedScores();
  if (!rows.length) return "";
  let sum = 0, n = 0;
  rows.forEach((r) => { sum += r.score.overall; n++; });
  return '<p class="fine">Your mean score on released feedback: <strong>' + Math.round((sum / n) * 100) + "%</strong> across " + n + " case" + (n === 1 ? "" : "s") + ".</p>";
}
function caseButton(c, learnerId) {
  const sub = learnerId ? submissionFor(learnerId, c.id) : null;
  let extra = "";
  if (learnerId && c.status === "feedback" && sub) {
    const sc = scoreSubmission(c, sub.answers);
    extra = '<span class="pill feedback">' + Math.round(sc.overall * 100) + "% · feedback</span>";
  } else if (learnerId && sub && c.status !== "feedback") extra = '<span class="pill">Submitted</span>';
  else if (learnerId && !sub && (c.status === "closed" || c.status === "feedback")) extra = '<span class="pill">Not submitted</span>';
  else extra = pill(c.status);
  return '<li><button type="button" class="case-link" data-action="open-case" data-case="' + esc(c.id) + '"><p class="meta">' + esc(caseMeta(c)) + '</p><h2>' + esc(c.title) + '</h2><div class="pills">' + extra + "</div></button></li>";
}
function renderLearnerHome() {
  const cases = db.cases.filter((c) => c.status !== "draft").sort(caseSort);
  const list = cases.length ? '<ul class="case-list">' + cases.map((c) => caseButton(c, session.learnerId)).join("") + "</ul>" : '<div class="card"><p>No case has been released yet.</p></div>';

}
function renderProfile(learner, revealAll) {
  const subs = db.submissions.filter((s) => s.learnerId === learner.id);
  const counted = subs.filter((s) => {
    const c = caseById(s.caseId);
    return c && (revealAll || c.status === "feedback") && c.scoredSteps.length;
  });
  const waiting = subs.filter((s) => {
    const c = caseById(s.caseId);
    return c && c.status !== "feedback";
  }).length;
  const byStep = SCORED_IDS.map((id) => {
    let n = 0, sum = 0;
    counted.forEach((s) => {
      const c = caseById(s.caseId);
      if (!c.scoredSteps.includes(id)) return;
      n++; sum += scoreStep(id, c.answerKey, s.answers);
    });
    return { id, n, mean: n ? sum / n : null };
  });
  let overallN = 0, overallSum = 0;
  byStep.forEach((r) => { if (r.n) { overallN += r.n; overallSum += r.mean * r.n; } });
  const bars = byStep.map((r) => {
    const pct = r.mean == null ? 0 : Math.round(r.mean * 100);
    const step = stepById(r.id);
    return '<div class="bar-row"><span>' + step.n + " " + esc(step.title) + '</span><span class="bar-track"><span class="bar-fill" style="width:' + (r.mean == null ? 0 : pct) + '%"></span></span><span class="bar-num">' + (r.mean == null ? "—" : pct + "%") + "</span></div>";
  }).join("");
  const note = revealAll
    ? "Includes cases whose feedback is not released yet. This is the coaching view."
    : "Only cases with feedback released. Scores stay hidden until the following Monday, so the profile does not spoil the read.";
  return shell(false, '<p class="eyebrow">Competency profile</p><h1 class="h-page">' + esc(learner.name) + "</h1><p class=\"meta\">" + esc(learner.email) + " · " + esc(learner.id) + "</p><p class=\"lede\">" + esc(note) + "</p>"
    + '<ul class="stats"><li><strong>' + (overallN ? Math.round((overallSum / overallN) * 100) + "%" : "—") + '</strong><span>Mean step score</span></li><li><strong>' + counted.length + '</strong><span>Reads scored</span></li><li><strong>' + waiting + '</strong><span>Awaiting feedback</span></li></ul>'
    + '<div class="card"><p class="eyebrow">Accuracy by step</p>' + bars + '<p class="fine">A short bar is where to coach. It is the same step, marked the same way, across the months — not one bad case.</p></div>'
    + (session.role === "admin" ? '<p><button type="button" class="btn ghost" data-action="go" data-view="adminResults">Back to results</button></p>' : ""));
}
function ecgBlock(c) {
  if (!c.ecgImage) return '<p class="warn">No ECG image on this case.</p>';
  return '<div class="ecg-scroll"><button type="button" class="ecg-frame" data-action="open-ecg" data-case="' + esc(c.id) + '"><img alt="12-lead ECG for ' + esc(c.title) + '. Activate to open full screen." src="' + esc(c.ecgImage) + '"></button></div><p class="fine">Swipe to read the trace. Tap it for full screen, then pinch or drag.</p>';
}
function renderCase() {
  const c = caseById(route.caseId);
  if (!c) return shell(false, "<p>That case is not on this device.</p>");
  const mode = learnerMode(c);
  if (mode === "hidden" || mode === "draft") return shell(false, '<p class="eyebrow">Unavailable</p><h1 class="h-page">This case is not open.</h1><p>Draft cases stay with the facilitator.</p>');
  const preview = route.preview ? '<p class="warn">Learner preview. Submission is turned off. <button type="button" class="btn ghost" data-action="go" data-view="adminEdit" data-case="' + esc(c.id) + '">Back to editor</button></p>' : "";
  const head = preview + '<p class="meta">' + esc(caseMeta(c)) + "</p><h1 class=\"h-page\">" + esc(c.title) + '</h1><div class="pills">' + pill(c.status) + "</div>";
  const story = '<div class="card vignette"><p class="eyebrow">Clinical vignette</p><p>' + esc(c.vignette || "No vignette.") + "</p></div>" + ecgBlock(c);
  if (mode === "form") {
    const answers = activeAnswers();
    const steps = c.scoredSteps.map((id) => stepById(id)).filter(Boolean);
    const left = steps.filter((s) => !stepComplete(s.id, answers)).length + (stepComplete("impression", answers) ? 0 : 1);
    const fields = steps.map((s) => stepFields(s, answers, "")).join("") + stepFields(stepById("impression"), answers, "");
    const dock = route.preview ? "" : '<div class="dock"><button type="button" class="btn block" data-action="ask-submit">Submit read</button><p class="fine">' + (left ? left + " still to answer." : "Ready to submit.") + " You can submit once.</p></div>";
    return shell(false, head + story + '<div class="card" style="margin-top:14px"><p class="eyebrow">Assessment</p><p class="lede">Same template every week. Work down the page, then write the impression. Submit once. The key stays hidden until feedback is released.</p>' + fields + dock + "</div>" + proveBlock(c));
  }
  if (mode === "submitted" || mode === "closed" || mode === "missed-closed") {
    const sub = session.role === "learner" ? submissionFor(session.learnerId, c.id) : null;
    let body = '<div class="card"><p class="eyebrow">Waiting</p><h2 class="section-title">' + (sub ? "Read submitted" : "Submissions are closed") + "</h2><p>" + (sub ? "Feedback has not been released. Your answers are below. The key is not." : "You did not submit a read. The key stays hidden until feedback is released.") + "</p></div>";
    if (sub) {
      body += '<div class="card">' + c.scoredSteps.map((id) => '<section class="step"><header class="step-h"><span class="num">' + stepById(id).n + "</span><h2>" + esc(stepById(id).title) + "</h2></header><p class=\"read\">" + esc(human(id, sub.answers)) + "</p></section>").join("")
        + '<section class="step"><header class="step-h"><span class="num">' + stepById("impression").n + '</span><h2>Impression</h2></header><p class="read">' + esc(sub.answers.impression || "Not answered") + "</p></section></div>";
    }
    return shell(false, head + story + body + proveBlock(c));
  }
  const sub = session.role === "learner" ? submissionFor(session.learnerId, c.id) : null;
  const score = sub ? scoreSubmission(c, sub.answers) : null;
  let fb = '<div class="card score-block"><p class="eyebrow">' + (sub ? "Your score" : "Feedback") + "</p>";
  if (score) fb += '<p class="big">' + Math.round(score.overall * 100) + '%</p><p class="fine">Mean of ' + score.n + " scored step" + (score.n === 1 ? "" : "s") + ". Each step weighs the same. A lead list gets partial credit. The impression is not auto-scored.</p>";
  else fb += "<p>You did not submit a read. The key is shown because feedback has been released. It does not create a score.</p>";
  if (sub && needsSafety(c, sub.answers)) fb += "<p>Your read tripped the escalate banner. That teaches the stop. It does not block a submission.</p>";
  fb += "</div>";
  fb += '<div class="card"><p class="eyebrow">Teaching point</p><p>' + esc(c.teachingPoint || "No teaching point recorded.") + "</p></div>";
  if (sub) {
    fb += '<div class="card">' + c.scoredSteps.map((id) => resultStep(stepById(id), sub.answers, c.answerKey, score.steps[id])).join("") + impressionBlock(sub.answers.impression, c.modelImpression) + "</div>";
  } else {
    fb += '<div class="card">' + c.scoredSteps.map((id) => '<section class="step"><header class="step-h"><span class="num">' + stepById(id).n + "</span><h2>" + esc(stepById(id).title) + '</h2></header><p class="read">' + esc(human(id, c.answerKey)) + "</p></section>").join("") + impressionBlock("", c.modelImpression) + "</div>";
  }
  return shell(false, head + story + fb + proveBlock(c));
}

function publishProblems(c) {
  const problems = [];
  if (!String(c.verifiedBy || "").trim() || !String(c.provenance || "").trim()) problems.push("Verified by or the provenance note is blank.");
  if (!c.ecgImage) problems.push("There is no ECG image.");
  if (!String(c.title || "").trim()) problems.push("The case has no title.");
  if (!String(c.vignette || "").trim()) problems.push("The vignette is empty.");
  const missing = (c.scoredSteps || []).filter((id) => !stepComplete(id, c.answerKey)).map((id) => stepById(id).n + " " + stepById(id).title);
  if (missing.length) problems.push("Answer key incomplete for " + missing.join(", ") + ".");
  if (!String(c.modelImpression || "").trim()) problems.push("The model impression is empty.");
  if (!String(c.teachingPoint || "").trim()) problems.push("The teaching point is empty.");
  return problems;
}
function fieldInput(label, field, value, multiline) {
  if (multiline) return '<label class="field"><span>' + esc(label) + '</span><textarea data-field="' + field + '" data-focus="' + field + '">' + esc(value || "") + "</textarea></label>";
  return '<label class="field"><span>' + esc(label) + '</span><input data-field="' + field + '" data-focus="' + field + '" value="' + esc(value || "") + '"></label>';
}
function renderAdminCases() {
  const cases = db.cases.slice().sort(caseSort);
  const rows = cases.map((c) => {
    const n = db.submissions.filter((s) => s.caseId === c.id).length;
    const scored = db.submissions.filter((s) => s.caseId === c.id);
    let mean = "—";
    if (scored.length) {
      const avg = scored.reduce((sum, s) => sum + scoreSubmission(c, s.answers).overall, 0) / scored.length;

function statsFor(caseId) {
  return SCORED_IDS.map((id) => {
    let n = 0, sum = 0, errors = 0;
    db.submissions.forEach((sub) => {
      const c = caseById(sub.caseId);
      if (!c || (caseId && c.id !== caseId) || !c.scoredSteps.includes(id)) return;
      const s = scoreStep(id, c.answerKey, sub.answers);
      n++; sum += s; if (s < 0.999) errors++;
    });
    return { id, n, mean: n ? sum / n : null, error: n ? errors / n : null };
  });
}
function cellStat(r) {
  if (!r || !r.n) return "—";
  return Math.round(r.error * 100) + '% error<br><span class="fine">mean ' + Math.round(r.mean * 100) + "% · n=" + r.n + "</span>";
}
function barChart(rows) {
  const width = 640, labelW = 168, right = 48, rowH = 32;
  const height = rows.length * rowH + 8;
  const barMax = width - labelW - right;
  const body = rows.map((r, i) => {
    const y = 8 + i * rowH;
    const step = stepById(r.id);
    const label = step.n + " " + step.title;
    if (r.error == null) return '<text x="0" y="' + (y + 14) + '" font-size="14" fill="#16181d">' + esc(label) + '</text><text x="' + width + '" y="' + (y + 14) + '" font-size="14" fill="#5f6368" text-anchor="end">—</text>';
    const pct = Math.round(r.error * 100);
    const bw = pct === 0 ? 0 : Math.max(2, (pct / 100) * barMax);
    return '<text x="0" y="' + (y + 14) + '" font-size="14" fill="#16181d">' + esc(label) + '</text><rect x="' + labelW + '" y="' + y + '" width="' + barMax + '" height="10" rx="2" class="chart-track" fill="#e3ded6"/><rect x="' + labelW + '" y="' + y + '" width="' + bw.toFixed(1) + '" height="10" rx="2" fill="#b03a2e"/><text x="' + width + '" y="' + (y + 14) + '" font-size="14" fill="#16181d" text-anchor="end">' + pct + "%</text>";
  }).join("");
  return '<svg class="chart" viewBox="0 0 ' + width + " " + height + '" role="img" aria-label="Error rate by step">' + body + "</svg>";
}

function sheetModel() {
  const cases = db.cases.filter((c) => c.status !== "draft").sort(caseSort);
  const rows = db.learners.map((learner) => {
    const mine = db.submissions.filter((s) => s.learnerId === learner.id);
    const byCase = {};
    mine.forEach((s) => { byCase[s.caseId] = s; });
    let sum = 0;
    let reads = 0;
    const cells = cases.map((c) => {
      const s = byCase[c.id];
      if (!s) return { score: null, at: "" };
      const overall = scoreSubmission(c, s.answers).overall;
      sum += overall;
      reads += 1;
      return { score: overall, at: s.submittedAt || "" };
    });
    const last = mine.map((s) => s.submittedAt || "").sort().pop() || "";
    return { learner, cells, reads, mean: reads ? sum / reads : null, last, expected: cases.length };
  });
  rows.sort((a, b) => {
    if (a.mean == null && b.mean == null) return a.learner.name.localeCompare(b.learner.name);
    if (a.mean == null) return 1;
    if (b.mean == null) return -1;
    if (b.mean !== a.mean) return b.mean - a.mean;
    if (b.reads !== a.reads) return b.reads - a.reads;
    return a.learner.name.localeCompare(b.learner.name);
  });
  let rank = 0;
  rows.forEach((row) => {
    if (row.mean == null) row.rank = "";
    else { rank += 1; row.rank = rank; }
  });
  return { cases, rows };
}

    return;
  }
  if (el.dataset && el.dataset.purpose === "import" && el.files && el.files[0]) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const payload = JSON.parse(String(reader.result));
        if (!payload || !Array.isArray(payload.cases) || !Array.isArray(payload.learners) || !Array.isArray(payload.submissions)) throw new Error("shape");
        ui.importPayload = payload;
        ui.dialog = { kind: "import" };
        ui.error = "";
        renderPreserve();
      } catch (err) {
        ui.error = "That file is not a Lab export.";
        renderPreserve();
      }
    };
    reader.readAsText(el.files[0]);
    return;
  }
  if (!el.dataset || !el.dataset.field) return;
  if (el.type === "checkbox") writeField(el.dataset.field, el.checked, "set");
  else if (el.tagName === "SELECT") writeField(el.dataset.field, el.value, "set");
}
function validEmail(em) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em); }
function submitFocus(form) {
  const topic = String(form.topic.value || "").trim();
  const why = String(form.why.value || "").trim();
  const email = String(form.email.value || "").trim();
  ui.focusDraft = { topic: topic, why: why, email: email };
  ui.error = "";
  if (topic.length < 3) { ui.error = "Name the topic in a few words."; render(); return; }
  if (why.length < 8) { ui.error = "Say why it matters on your ward."; render(); return; }
  if (email && !validEmail(email)) { ui.error = "That email does not look usable. Leave it blank if you do not want a reply."; render(); return; }
  const key = topicKey(topic);
  const id = voterId();
  db.focusRequests = db.focusRequests || [];
  let row = db.focusRequests.find((item) => item.topicKey === key);
  if (row && (row.voters || []).indexOf(id) !== -1) {
    ui.error = "You have already voted for this topic.";
    render();
    return;
  }
  const now = new Date().toISOString();
  if (!row) {
    row = { id: makeId("f"), topic: topic, topicKey: key, votes: 0, voters: [], notes: [], createdAt: now, updatedAt: now };
    db.focusRequests.push(row);
  }
  row.votes = (row.votes || 0) + 1;
  row.voters = (row.voters || []).concat([id]);
  row.notes = (row.notes || []).concat([{ why: why, email: email, at: now }]);
  row.updatedAt = now;
  touch();
  saveDb();
  ui.focusDraft = { topic: "", why: "", email: "" };
  ui.notice = "Request saved. It now has " + row.votes + (row.votes === 1 ? " vote." : " votes.");
  ui.error = "";
  render();
  window.scrollTo(0, 0);
}
function voteFocus(id) {
  const row = (db.focusRequests || []).find((item) => item.id === id);
  if (!row) return;
  const vid = voterId();
  if ((row.voters || []).indexOf(vid) !== -1) return;
  row.votes = (row.votes || 0) + 1;
  row.voters = (row.voters || []).concat([vid]);
  row.updatedAt = new Date().toISOString();
  touch();
  saveDb();
  renderPreserve();
}
function submitContribution(form) {
  const summary = String(form.summary.value || "").trim();
  const teachingPoint = String(form.teachingPoint.value || "").trim();
  const fit = String(form.fit.value || "").trim();
  const name = String(form.name.value || "").trim();
  const role = String(form.role.value || "").trim();
  const consent = !!form.consent.checked;
  ui.contribDraft = { summary: summary, teachingPoint: teachingPoint, fit: fit, name: name, role: role, consent: consent };
  if (summary.length < 8 || teachingPoint.length < 8 || fit.length < 2 || name.length < 2 || role.length < 2) {
    ui.error = "Add a clinical summary, the teaching point, where it fits, your name, and your role.";
    render();
    return;
  }
  if (!consent) { ui.error = "Tick the consent line before you send this."; render(); return; }
  db.contributions = db.contributions || [];
  db.contributions.push({
    id: makeId("k"),
    summary: summary,
    teachingPoint: teachingPoint,
    fit: fit,
    name: name,
    role: role,
    consent: true,
    status: "new",
    createdAt: new Date().toISOString(),
  });
  touch();
  saveDb();
  ui.contribDraft = { summary: "", teachingPoint: "", fit: "", name: "", role: "", consent: false };
  ui.notice = "Sent. A facilitator will set a status. Do not send an ECG or an image with this.";
  ui.error = "";
  render();
  window.scrollTo(0, 0);
}
function setContribStatus(id, status) {
  const row = (db.contributions || []).find((item) => item.id === id);
  if (!row) return;
  if (!CONTRIB_STATUS.some((item) => item[0] === status)) return;
  row.status = status;
  touch();
  saveDb();
  renderPreserve();
}
function onSubmit(e) {
  const form = e.target.closest && e.target.closest("form");
  if (!form) return;
  e.preventDefault();
  if (form.dataset.action === "login") loginLearner(form.name.value, form.email.value);
  else if (form.dataset.action === "facilitator") {
    const em = String(form.email.value || "").trim().toLowerCase();
    ui.loginEmail = String(form.email.value || "").trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) {
      ui.error = "Enter the facilitator email.";
      renderPreserve();
      return;
    }
    if (!isFacilitatorEmail(em)) {
      ui.error = "That email does not have facilitator access.";
      renderPreserve();
      return;
    }
    enterFacilitator();
  }
  else if (form.dataset.action === "focus") submitFocus(form);
  else if (form.dataset.action === "contribute") submitContribution(form);
}
function freshUi() { return { error: "", storageError: "", dialog: null, lb: null, highlight: "", scope: "all", previewDraft: null, importPayload: null, loginName: "", loginEmail: "", focusDraft: null, contribDraft: null, notice: "" }; }

function boot() {
  db = loadDb();
  session = loadSession();
  ui = freshUi();
  if (session && session.role === "admin" && !isFacilitatorEmail(session.email)) {
    session = null;
    saveSession();
  }
  if (session && session.role === "learner" && !learnerById(session.learnerId)) session = null;
  route = !session ? { view: "signin" } : session.role === "admin" ? { view: "adminCases" } : { view: "learnerHome" };
  const root = document.getElementById("app");
  root.addEventListener("click", onClick);
  root.addEventListener("input", onInput);
  root.addEventListener("change", onChange);
  root.addEventListener("submit", onSubmit);
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (ui.lb) { ui.lb = null; renderPreserve(); }
    else if (ui.dialog) { ui.dialog = null; renderPreserve(); }
  });
  render();
}
boot();
</script>
</body>
